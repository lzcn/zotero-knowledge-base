<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?> <?xml-stylesheet
href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet
href="chrome://knowledge-base/content/manager.css?v=__styleVersion__"
type="text/css"?>
<window
  id="knowledge-base-editor"
  windowtype="knowledge-base:editor"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  width="1000"
  height="720"
  persist="width height screenX screenY"
>
  <script src="chrome://zotero/content/include.js" />
  <script src="chrome://knowledge-base/content/markdown.js" />
  <script src="chrome://knowledge-base/content/editor-formatting.js" />
  <script src="chrome://global/content/globalOverlay.js" />
  <script src="chrome://zotero/content/editMenuOverlay.js" />
  <script src="chrome://zotero/content/customElements.js" />
  <script src="chrome://knowledge-base/content/native-editor.js?v=__styleVersion__" />
  <script src="chrome://knowledge-base/content/editor.js" />
  <html:div id="knowledge-base-editor-root">
    <html:div id="knowledge-base-editor-toolbar">
      <html:span id="knowledge-base-src-label" class="lbl"></html:span>
      <html:span id="knowledge-base-src-display" class="muted"></html:span>
      <button id="knowledge-base-src-pick"></button>
      <button id="knowledge-base-src-jump" hidden="hidden"></button>
      <button id="knowledge-base-src-anno" hidden="hidden"></button>
      <toolbarbutton
        id="knowledge-base-src-clear"
        class="kb-native-tool"
        hidden="hidden"
      />
    </html:div>
    <html:div id="knowledge-base-src-drop" hidden="hidden">
      <html:input id="knowledge-base-src-search" type="search" />
      <button id="knowledge-base-src-selected"></button>
      <html:div id="knowledge-base-src-status" class="muted" role="status" />
      <html:ul id="knowledge-base-src-results" class="refs"></html:ul>
    </html:div>
    <html:div
      id="knowledge-base-editor-health"
      class="note-health"
      hidden="hidden"
      role="status"
    >
      <html:span id="knowledge-base-editor-health-text" />
      <button id="knowledge-base-editor-restore" />
    </html:div>
    <html:details id="knowledge-base-metadata" hidden="hidden">
      <html:summary id="knowledge-base-metadata-summary" />
      <html:dl id="knowledge-base-metadata-fields" />
      <button id="knowledge-base-metadata-edit" />
    </html:details>
    <html:input id="knowledge-base-editor-title" type="text" />
    <html:div class="parent-control">
      <html:select id="knowledge-base-kind"
        ><html:option value="literature" /><html:option
          value="zettel" /><html:option value="thinking"
      /></html:select>
      <html:label
        id="knowledge-base-parent-label"
        for="knowledge-base-parent-search"
      />
      <button id="knowledge-base-parent-display" />
      <button id="knowledge-base-parent-root"></button>
      <html:input
        id="knowledge-base-parent-search"
        type="search"
        hidden="hidden"
      />
      <html:ul
        id="knowledge-base-parent-results"
        class="refs"
        hidden="hidden"
      />
    </html:div>
    <html:div id="knowledge-base-markdown-toolbar">
      <button
        id="knowledge-base-command-open"
        class="icon-button"
        aria-expanded="false"
      ></button>
      <button id="knowledge-base-link-pick"></button>
      <button id="knowledge-base-url-insert" />
      <button id="knowledge-base-image-insert" />
      <button id="knowledge-base-src-insert" disabled="disabled"></button>
      <html:div class="spacer" />
      <button id="knowledge-base-editor-format" />
      <button id="knowledge-base-editor-mode" />
    </html:div>
    <html:div
      id="knowledge-base-command-menu"
      class="command-menu"
      hidden="hidden"
    >
      <html:input id="knowledge-base-command-search" type="search" />
      <html:div id="knowledge-base-command-list" role="menu" />
    </html:div>
    <html:div id="knowledge-base-link-drop" hidden="hidden">
      <html:input id="knowledge-base-link-search" type="search" />
      <html:div id="knowledge-base-link-status" class="muted" role="status" />
      <html:ul id="knowledge-base-link-results" class="refs" />
    </html:div>
    <html:div id="knowledge-base-editor-content">
      <html:div id="knowledge-base-editor-workspace">
        <html:textarea
          id="knowledge-base-editor-body"
          wrap="soft"
          spellcheck="true"
          hidden="hidden"
        />
        <html:div
          id="knowledge-base-editor-preview"
          class="markdown-body"
          tabindex="0"
          hidden="hidden"
        />
        <note-editor id="knowledge-base-rich-frame" flex="1" hidden="hidden" />
      </html:div>
      <html:details id="knowledge-base-editor-relations">
        <html:summary id="knowledge-base-editor-relations-summary" />
        <html:div class="editor-connections">
          <html:div id="knowledge-base-editor-family" />
          <html:details>
            <html:summary id="knowledge-base-editor-outgoing-label" />
            <html:ul id="knowledge-base-editor-outgoing" class="refs" />
          </html:details>
          <html:details>
            <html:summary id="knowledge-base-editor-backlinks-label" />
            <html:ul id="knowledge-base-editor-backlinks" class="refs" />
          </html:details>
          <toolbarbutton
            id="knowledge-base-editor-graph"
            class="kb-native-tool"
          />
        </html:div>
      </html:details>
    </html:div>
    <html:footer id="knowledge-base-editor-footer">
      <html:span
        id="knowledge-base-editor-status"
        class="muted"
        role="status"
        aria-live="polite"
      ></html:span>
      <html:div class="spacer" />
      <button id="knowledge-base-editor-save-copy" hidden="true" />
      <button id="knowledge-base-editor-cancel"></button>
      <button id="knowledge-base-editor-save" default="true"></button>
    </html:footer>
    <html:div id="knowledge-base-anno-layer" hidden="hidden">
      <html:div id="knowledge-base-anno-box">
        <html:h2 id="knowledge-base-anno-head"></html:h2>
        <html:ul id="knowledge-base-anno-list"></html:ul>
        <html:div
          id="knowledge-base-anno-empty"
          class="muted"
          hidden="hidden"
        ></html:div>
        <html:footer>
          <html:div class="spacer" />
          <button id="knowledge-base-anno-cancel"></button>
          <button id="knowledge-base-anno-insert" default="true"></button>
        </html:footer>
      </html:div>
    </html:div>
  </html:div>
</window>
