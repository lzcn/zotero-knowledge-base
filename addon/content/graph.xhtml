<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?> <?xml-stylesheet
href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<?xml-stylesheet
href="chrome://knowledge-base/content/manager.css?v=__styleVersion__"
type="text/css"?> <?xml-stylesheet
href="chrome://knowledge-base/content/graph.css?v=__styleVersion__"
type="text/css"?>
<window
  id="knowledge-base-graph"
  windowtype="knowledge-base:graph"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  xmlns:svg="http://www.w3.org/2000/svg"
  width="1100"
  height="760"
  persist="width height screenX screenY"
>
  <script src="chrome://zotero/content/include.js" />
  <script src="chrome://knowledge-base/content/graph.js" />
  <html:div id="knowledge-base-graph-root">
    <html:header id="knowledge-base-graph-toolbar">
      <toolbarbutton id="graph-global" class="knowledge-base-native-tool" />
      <toolbarbutton id="graph-local" class="knowledge-base-native-tool" />
      <html:select id="graph-view">
        <html:option value="all" />
        <html:option value="literature" />
        <html:option value="zettel" />
        <html:option value="thinking" />
        <html:option value="entity" />
      </html:select>
      <html:input id="graph-search" type="search" />
      <checkbox id="graph-outline" />
      <checkbox id="graph-references" />
      <checkbox id="graph-hide-isolated" />
      <html:div class="spacer" />
      <toolbarbutton id="graph-fit" class="knowledge-base-native-tool" />
      <toolbarbutton id="graph-refresh" class="knowledge-base-native-tool" />
      <html:span id="graph-stats" class="muted" />
    </html:header>
    <html:main id="knowledge-base-graph-main">
      <html:div id="graph-canvas">
        <html:canvas id="graph-gpu" hidden="hidden" aria-hidden="true" />
        <html:canvas id="graph-paint" hidden="hidden" aria-hidden="true" />
        <svg:svg id="graph-svg" aria-label="Card graph" />
        <html:div id="graph-error" class="error" role="status" />
        <html:div id="graph-empty" class="muted" hidden="hidden" />
      </html:div>
      <html:div id="graph-splitter" />
      <html:aside id="graph-inspector">
        <html:div id="graph-selection" hidden="hidden">
          <html:header class="graph-node-heading">
            <html:h2 id="graph-node-title" />
            <toolbarbutton
              id="graph-node-open"
              class="knowledge-base-native-tool"
            />
          </html:header>
          <html:div id="graph-node-kind" class="muted" />
          <html:button
            id="graph-node-reference"
            class="note-reference"
            hidden="hidden"
          />
          <html:div
            id="graph-node-tags"
            class="note-tags"
            role="list"
            hidden="hidden"
          />
          <html:div id="graph-node-snippet" class="markdown-body" />
          <html:h3 id="graph-connections-title" />
          <html:div id="graph-connections" />
        </html:div>
      </html:aside>
    </html:main>
  </html:div>
</window>
