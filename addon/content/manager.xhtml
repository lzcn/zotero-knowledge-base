<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?> <?xml-stylesheet
href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<?xml-stylesheet
href="chrome://knowledge-base/content/manager.css?v=__styleVersion__"
type="text/css"?>
<window
  id="knowledge-base-manager"
  windowtype="knowledge-base:manager"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  width="980"
  height="640"
  persist="width height screenX screenY"
>
  <script src="chrome://zotero/content/include.js" />
  <script src="chrome://knowledge-base/content/ui.js" />
  <script src="chrome://knowledge-base/content/markdown.js" />
  <script src="chrome://knowledge-base/content/manager.js" />
  <popupset>
    <menupopup id="knowledge-base-note-menu" />
  </popupset>
  <html:div id="knowledge-base-root">
    <html:header id="knowledge-base-toolbar">
      <toolbarbutton
        id="knowledge-base-back"
        class="knowledge-base-native-tool"
      />
      <toolbarbutton
        id="knowledge-base-forward"
        class="knowledge-base-native-tool"
      />
      <toolbarbutton
        id="knowledge-base-btn-new"
        class="knowledge-base-native-tool"
      />
      <toolbarbutton
        id="knowledge-base-btn-graph"
        class="knowledge-base-native-tool"
      />
      <toolbarbutton
        id="knowledge-base-btn-copy-zettels"
        class="knowledge-base-native-tool"
      />
      <html:input id="knowledge-base-search" type="search" />
      <html:div id="knowledge-base-views" role="group">
        <toolbarbutton
          id="knowledge-base-view-all"
          class="knowledge-base-native-tool knowledge-base-view-button"
          data-note-view="all"
        />
        <toolbarbutton
          id="knowledge-base-view-literature"
          class="knowledge-base-native-tool knowledge-base-view-button"
          data-note-view="literature"
        />
        <toolbarbutton
          id="knowledge-base-view-zettel"
          class="knowledge-base-native-tool knowledge-base-view-button"
          data-note-view="zettel"
        />
        <toolbarbutton
          id="knowledge-base-view-thinking"
          class="knowledge-base-native-tool knowledge-base-view-button"
          data-note-view="thinking"
        />
      </html:div>
      <toolbarbutton
        id="knowledge-base-view-trash"
        class="knowledge-base-native-tool knowledge-base-view-button"
        data-note-view="trash"
      />
      <html:div class="spacer" />
      <html:span id="knowledge-base-stats" class="muted"></html:span>
      <html:div class="card-actions" role="group">
        <toolbarbutton
          id="knowledge-base-btn-edit"
          class="knowledge-base-native-tool"
        />
        <toolbarbutton
          id="knowledge-base-btn-local-graph"
          class="knowledge-base-native-tool"
        />
        <toolbarbutton
          id="knowledge-base-btn-restore"
          class="knowledge-base-native-tool"
          hidden="true"
        />
        <button id="knowledge-base-empty-trash" hidden="true" />
        <button id="knowledge-base-trash-cancel" hidden="true" />
        <toolbarbutton
          id="knowledge-base-btn-delete"
          class="knowledge-base-native-tool"
        />
      </html:div>
    </html:header>
    <html:div id="knowledge-base-trash-status" hidden="hidden" role="status" />
    <html:main id="knowledge-base-main">
      <html:section id="knowledge-base-list-pane">
        <html:div id="knowledge-base-list-toolbar">
          <html:select id="knowledge-base-sort">
            <html:option value="updated-desc" />
            <html:option value="updated-asc" />
            <html:option value="created-desc" />
            <html:option value="created-asc" />
            <html:option value="title-asc" />
            <html:option value="title-desc" />
            <html:option value="id-asc" />
            <html:option value="id-desc" />
          </html:select>
        </html:div>
        <html:ul id="knowledge-base-list"></html:ul>
      </html:section>
      <html:div id="knowledge-base-splitter" />
      <html:section id="knowledge-base-detail-pane">
        <browser id="knowledge-base-workbench-editor" flex="1" hidden="true" />
        <html:div id="knowledge-base-detail-empty" class="muted"></html:div>
        <html:div id="knowledge-base-detail" hidden="hidden">
          <html:header class="card-heading">
            <html:h1 id="knowledge-base-detail-title" />
          </html:header>
          <html:div class="card-metadata">
            <html:div id="knowledge-base-detail-id" class="card-index" />
            <html:button
              id="knowledge-base-detail-reference"
              class="note-reference"
            />
            <html:div id="knowledge-base-detail-meta" class="muted" />
          </html:div>
          <html:div
            id="knowledge-base-detail-health"
            class="note-health"
            hidden="hidden"
            role="status"
          />
          <html:div id="knowledge-base-detail-source" class="refs"></html:div>
          <html:h2 id="knowledge-base-preview-head"></html:h2>
          <html:div
            id="knowledge-base-preview"
            class="markdown-body"
          ></html:div>
          <html:section class="card-connections">
            <html:section class="card-family">
              <html:div id="knowledge-base-family" class="relation-columns" />
              <html:button
                id="knowledge-base-btn-child"
                class="family-create"
              />
            </html:section>
            <html:div class="relation-columns reference-columns">
              <html:details>
                <html:summary id="knowledge-base-outgoing-head" />
                <html:div id="knowledge-base-outgoing" class="chips" />
              </html:details>
              <html:details>
                <html:summary id="knowledge-base-backlinks-head" />
                <html:ul id="knowledge-base-backlinks" class="refs" />
              </html:details>
            </html:div>
          </html:section>
        </html:div>
      </html:section>
    </html:main>
    <html:details id="knowledge-base-unresolved" hidden="hidden">
      <html:summary id="knowledge-base-unresolved-head" />
      <html:ul id="knowledge-base-unresolved-list" class="refs" />
    </html:details>
    <hbox id="knowledge-base-drafts" hidden="true" align="center">
      <label
        id="knowledge-base-drafts-label"
        control="knowledge-base-draft-list"
      />
      <menulist id="knowledge-base-draft-list" native="true"
        ><menupopup id="knowledge-base-draft-menu"
      /></menulist>
      <button id="knowledge-base-restore-draft" />
    </hbox>
    <html:div
      id="knowledge-base-copy-status"
      class="muted"
      role="status"
      hidden="hidden"
    />
    <html:div id="knowledge-base-error" hidden="hidden"></html:div>
  </html:div>
</window>
