<?xml version="1.0"?>
<?xml-stylesheet
href="chrome://knowledge-base/content/manager.css?v=__styleVersion__"
type="text/css"?>
<window
  id="knowledge-base-annotations"
  windowtype="knowledge-base:annotations"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  width="720"
  height="600"
  persist="width height screenX screenY"
>
  <script src="chrome://zotero/content/include.js" />
  <script src="chrome://knowledge-base/content/annotations.js" />
  <html:div id="knowledge-base-pick-root">
    <html:header id="knowledge-base-pick-toolbar">
      <html:div id="knowledge-base-pick-head">
        <html:h1 id="knowledge-base-pick-title"></html:h1>
        <html:div id="knowledge-base-pick-source" class="muted"></html:div>
      </html:div>
      <html:div class="spacer" />
      <html:button id="knowledge-base-pick-toggle"></html:button>
    </html:header>
    <html:ul id="knowledge-base-pick-rows"></html:ul>
    <html:div
      id="knowledge-base-pick-empty"
      class="muted"
      hidden="hidden"
    ></html:div>
    <html:footer id="knowledge-base-pick-footer">
      <html:span id="knowledge-base-pick-status" class="muted"></html:span>
      <html:div class="spacer" />
      <html:button id="knowledge-base-pick-close"></html:button>
      <html:button
        id="knowledge-base-pick-create"
        class="primary"
      ></html:button>
    </html:footer>
  </html:div>
</window>
