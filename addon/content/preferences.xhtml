<vbox
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
>
  <vbox class="main-section">
    <groupbox aria-labelledby="knowledge-base-graph-heading">
      <label
        ><html:h2
          id="knowledge-base-graph-heading"
          data-l10n-id="knowledge-base-preferences-graph"
      /></label>
      <checkbox
        native="true"
        data-l10n-id="knowledge-base-pref-outline"
        preference="extensions.zotero.knowledge-base.graph.outline"
      />
      <checkbox
        native="true"
        data-l10n-id="knowledge-base-pref-references"
        preference="extensions.zotero.knowledge-base.graph.references"
      />
      <checkbox
        native="true"
        data-l10n-id="knowledge-base-pref-sources"
        preference="extensions.zotero.knowledge-base.graph.sources"
      />
    </groupbox>
  </vbox>
</vbox>
