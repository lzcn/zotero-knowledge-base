<vbox
  class="plugin-preferences"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  onload="window.KnowledgeBaseCommonPreferences.start(document); window.KnowledgeBasePreferences.start(document)"
  onshowing="window.KnowledgeBaseCommonPreferences.start(document); window.KnowledgeBasePreferences.start(document)"
>
  <vbox class="main-section">
    <html:h3 data-l10n-id="knowledge-base-settings-common" />
    <hbox class="preference-row" align="center">
      <label
        control="knowledge-base-ui-style"
        data-l10n-id="knowledge-base-pref-ui-style"
      />
      <menulist native="true" id="knowledge-base-ui-style">
        <menupopup>
          <menuitem value="minimal" label="Minimal" />
          <menuitem value="bear" label="Bear" />
        </menupopup>
      </menulist>
    </hbox>
  </vbox>
  <vbox class="main-section">
    <html:h3 data-l10n-id="knowledge-base-settings-notes" />
    <hbox class="preference-row" align="center">
      <label
        control="knowledge-base-workbench-mode"
        data-l10n-id="knowledge-base-pref-workbench-mode"
      />
      <menulist native="true" id="knowledge-base-workbench-mode">
        <menupopup>
          <menuitem
            value="tab"
            data-l10n-id="knowledge-base-pref-workbench-tab"
          />
          <menuitem
            value="window"
            data-l10n-id="knowledge-base-pref-workbench-window"
          />
        </menupopup>
      </menulist>
    </hbox>
    <hbox class="preference-row" align="center">
      <label
        control="knowledge-base-source-style"
        data-l10n-id="knowledge-base-pref-source-style"
      />
      <menulist native="true" id="knowledge-base-source-style">
        <menupopup id="knowledge-base-source-styles" />
      </menulist>
    </hbox>
    <checkbox
      id="knowledge-base-inherit-tags"
      native="true"
      data-l10n-id="knowledge-base-pref-inherit-tags"
    />
  </vbox>
  <vbox class="main-section">
    <html:h3 data-l10n-id="knowledge-base-pref-literature-template" />
    <hbox class="preference-row" align="center">
      <label
        control="knowledge-base-literature-template"
        data-l10n-id="knowledge-base-pref-template-choice"
      />
      <menulist id="knowledge-base-literature-template" native="true">
        <menupopup id="knowledge-base-literature-templates" />
      </menulist>
      <button
        id="knowledge-base-template-new"
        data-l10n-id="knowledge-base-pref-template-new"
      />
      <button
        id="knowledge-base-template-delete"
        hidden="true"
        data-l10n-id="knowledge-base-pref-template-delete"
      />
    </hbox>
    <vbox id="knowledge-base-template-editor" hidden="true">
      <hbox class="preference-row" align="center">
        <label
          control="knowledge-base-template-name"
          data-l10n-id="knowledge-base-pref-template-name"
        />
        <html:input
          id="knowledge-base-template-name"
          type="text"
          required="required"
        />
      </hbox>
      <html:label
        for="knowledge-base-template-body"
        data-l10n-id="knowledge-base-pref-template-edit"
      />
      <html:textarea id="knowledge-base-template-body" rows="6" />
      <description
        id="knowledge-base-template-error"
        role="alert"
        hidden="true"
      />
    </vbox>
  </vbox>
  <vbox class="main-section">
    <html:details id="knowledge-base-graph-appearance">
      <html:summary data-l10n-id="knowledge-base-pref-graph-appearance" />
      <hbox class="preference-row" align="center">
        <label
          id="knowledge-base-graph-label-length-label"
          control="knowledge-base-graph-label-length"
          data-l10n-id="knowledge-base-pref-graph-label-length"
        />
        <html:input
          id="knowledge-base-graph-label-length"
          type="number"
          min="8"
          max="80"
          step="1"
          class="preference-number"
          aria-labelledby="knowledge-base-graph-label-length-label"
        />
        <label data-l10n-id="knowledge-base-pref-graph-label-length-unit" />
      </hbox>
      <hbox class="preference-row" align="center">
        <label
          id="knowledge-base-graph-local-depth-label"
          control="knowledge-base-graph-local-depth"
          data-l10n-id="knowledge-base-pref-graph-local-depth"
        />
        <html:input
          id="knowledge-base-graph-local-depth"
          type="number"
          min="1"
          max="6"
          step="1"
          class="preference-number"
          aria-labelledby="knowledge-base-graph-local-depth-label"
        />
      </hbox>
      <html:h3 data-l10n-id="knowledge-base-pref-groups-heading" />
      <description data-l10n-id="knowledge-base-pref-groups-help" />
      <vbox id="knowledge-base-graph-groups" />
      <hbox
        ><button
          id="knowledge-base-add-group"
          data-l10n-id="knowledge-base-pref-add-group"
      /></hbox>
    </html:details>
    <description
      id="knowledge-base-preferences-error"
      hidden="true"
      role="alert"
    />
  </vbox>
  <vbox class="main-section">
    <html:h3 data-l10n-id="knowledge-base-settings-tags" />
    <hbox class="preference-row" align="center">
      <label
        control="similar-works-tag-style"
        data-l10n-id="similar-works-pref-tag-style"
      />
      <menulist
        native="true"
        id="similar-works-tag-style"
        preference="extensions.zotero.similar-works.tagNameStyle"
      >
        <menupopup>
          <menuitem
            value="sentence"
            data-l10n-id="similar-works-pref-tag-sentence"
          />
          <menuitem value="title" data-l10n-id="similar-works-pref-tag-title" />
        </menupopup>
      </menulist>
    </hbox>
    <checkbox
      native="true"
      id="similar-works-tag-hashtag"
      data-l10n-id="similar-works-pref-tag-hashtag"
      preference="extensions.zotero.similar-works.tagHashtag"
    />
    <checkbox
      native="true"
      id="similar-works-exclude-colored-tags"
      data-l10n-id="similar-works-pref-exclude-colored-tags"
      preference="extensions.zotero.similar-works.excludeColoredTags"
    />
    <hbox class="preference-row" align="start">
      <label
        control="similar-works-excluded-tags"
        data-l10n-id="similar-works-pref-excluded-tags"
      />
      <html:textarea
        id="similar-works-excluded-tags"
        rows="2"
        preference="extensions.zotero.similar-works.excludedTags"
        aria-describedby="similar-works-excluded-tags-help"
      />
    </hbox>
    <description
      id="similar-works-excluded-tags-help"
      class="preference-help"
      data-l10n-id="similar-works-pref-excluded-tags-help"
    />
  </vbox>
  <vbox class="main-section">
    <html:h3 data-l10n-id="knowledge-base-settings-similar" />
    <hbox class="preference-row" align="center">
      <label
        control="similar-works-limit"
        data-l10n-id="similar-works-pref-limit"
      />
      <html:input
        id="similar-works-limit"
        type="number"
        min="1"
        max="100"
        class="preference-number"
        preference="extensions.zotero.similar-works.maxRecommendations"
      />
    </hbox>
    <checkbox
      native="true"
      data-l10n-id="similar-works-pref-metadata"
      preference="extensions.zotero.similar-works.allowMetadataOnlyRecommendations"
    />
  </vbox>
  <vbox class="main-section" id="similar-works-diagnostics">
    <html:h3 data-l10n-id="similar-works-pref-index-heading" />
    <html:dl class="preference-status">
      <html:dt data-l10n-id="similar-works-pref-index" /><html:dd
        ><html:span id="similar-works-index" />
        <html:progress
          id="similar-works-index-progress"
          hidden="hidden"
          data-l10n-id="similar-works-pref-index-progress"
        />
      </html:dd>
      <html:dt data-l10n-id="similar-works-pref-vectors" /><html:dd
        ><html:span id="similar-works-vectors" />
        <html:progress
          id="similar-works-vector-progress"
          hidden="hidden"
          data-l10n-id="similar-works-pref-vector-progress"
        />
      </html:dd>
    </html:dl>
    <description id="similar-works-diagnostics-error" hidden="true" />
  </vbox>
</vbox>
