<?xml version="1.0"?>
<?xml-stylesheet
href="chrome://knowledge-base/content/paper-reading.css?v=__styleVersion__"
type="text/css"?>
<window
  id="knowledge-base-paper-reading"
  windowtype="knowledge-base:paper-reading"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  width="860"
  height="740"
  persist="width height screenX screenY"
>
  <script src="chrome://zotero/content/include.js" />
  <script src="chrome://knowledge-base/content/markdown.js" />
  <script src="chrome://knowledge-base/content/paper-reading.js" />
  <html:main id="reading-root">
    <html:header>
      <html:h1 id="reading-title" />
      <html:p id="reading-help" />
      <html:p id="reading-status" role="status" aria-live="polite" />
    </html:header>
    <html:section id="reading-content" hidden="hidden">
      <html:textarea id="reading-draft" spellcheck="false" />
      <html:div id="reading-preview" hidden="hidden" />
    </html:section>
    <html:footer>
      <html:button id="reading-toggle" hidden="hidden" />
      <html:span class="spacer" />
      <html:button id="reading-close" />
      <html:button id="reading-save" disabled="disabled" />
    </html:footer>
  </html:main>
</window>
